<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Llama neck (thick, going down-left from head) -->
  <path d="M13 29 L13 20 Q13 17 15 16" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.92"/>
  <!-- Llama head (circular) -->
  <circle cx="19.5" cy="13" r="7.5" fill="white" opacity="0.93"/>
  <!-- Left ear (pointed, top-left of head) -->
  <polygon points="13.5,9.5 11.5,4 15.5,7.5" fill="white" opacity="0.93"/>
  <!-- Right ear (pointed, top-right of head) -->
  <polygon points="21.5,7 21,2.5 24.5,6.5" fill="white" opacity="0.93"/>
  <!-- Eye — warm orange (Anthropic nod) -->
  <circle cx="21.5" cy="12" r="2.2" fill="#F97316"/>
  <!-- Eye pupil -->
  <circle cx="22" cy="12" r="1" fill="#431407"/>
  <!-- Tiny neural spark dots (Claude-style) -->
  <circle cx="6" cy="12" r="1.3" fill="#C4B5FD" opacity="0.8"/>
  <circle cx="6" cy="19" r="1" fill="#C4B5FD" opacity="0.6"/>
  <circle cx="8.5" cy="25.5" r="1.2" fill="#C4B5FD" opacity="0.5"/>
</svg>
